services:
  # Gemelo digital: MuJoCo + unitree_sdk2_python, expuesto por noVNC en el navegador.
  # Requiere que el repo unitree_mujoco esté clonado como carpeta hermana de este
  # proyecto (../../unitree_mujoco desde acá), tal como lo referencia backend/README.md.
  simulator:
    build:
      context: ./docker/simulator
    volumes:
      - ../../unitree_mujoco:/workspace/unitree_mujoco
    ports:
      - "6080:6080" # noVNC -> http://localhost:6080/vnc.html
      - "8000:8000" # backend (comparte red con este servicio, ver abajo)
    environment:
      - DISPLAY=:1

  # Backend FastAPI. Comparte el network namespace del simulador para poder
  # hablar DDS por "lo" (loopback) tal como espera unitree_sdk2_python/mujoco.
  backend:
    build:
      context: ./backend
    network_mode: "service:simulator"
    volumes:
      - ./backend/app:/app/app
    depends_on:
      - simulator
